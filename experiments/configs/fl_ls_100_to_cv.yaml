shared_config:
  # or set de-dev-transf.csv,de-test-transf.csv or fr-dev-transf.csv,fr-test-transf.csv
  eval: en-dev-transf.csv,en-test-transf.csv
  tar: tar_file
  # PUT HERE PATH TO THE MODEL
  restore_checkpoint: pretrained/jax-model
  is_restore_optim: False
pfl_config:
  # or set ids-de-train-transf.csv or ids-fr-train-transf.csv
  train: ids-en-train-transf.csv
  batch_size: 120
  # set any cohort size - we use the same hyperparameters: 8, 16, 32, 64, 128, 256
  cohort_size: 16
  server_steps: 2000
local_optim_config:
  optim: sgd
  lr: 0.2
  num_epochs: 10
server_optim_config:
  optim: lamb
  lr: 0.002
  lr_schedule: exp
  lr_decay_start_update: 750
  lr_exponential_decay_rate: 0.6
  lr_exponential_decay_transition_steps: 750
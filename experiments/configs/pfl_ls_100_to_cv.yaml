shared_config:
  # or use other language
  eval: en-dev-transf.csv,en-test-transf.csv
  tar: tar_file
  report: 25
  # PUT HERE PATH TO THE MODEL
  restore_checkpoint: pretrained/jax-model
  is_restore_optim: False
pfl_config:
  # or use other language
  train: ids-en-train-transf.csv
  batch_size: 120
  # set any cohort size - we use the same hyperparameters
  cohort_size: 1024
  server_steps: 2000
local_optim_config:
  optim: sgd
  lr: 0.2
  num_epochs: -1
  num_steps: 10
server_optim_config:
  optim: lamb
  lr: 0.002
  lr_schedule: exp
  lr_decay_start_update: 750
  lr_exponential_decay_rate: 0.6
  lr_exponential_decay_transition_steps: 750
# we modify only dp_config, the rest is used the same for all configurations of FL + DP
dp_config:
  # modify here clipping type, e.g. global or per layer (uniform or per dim)
  clip_deltas_per_layer: 0.01
  # modify here the noise level
  dp_sigma: 1e-7


shared_config:
  eval: dev-clean.csv,dev-other.csv,test-clean.csv,test-other.csv
  tar: tar_file
  # PUT HERE PATH TO THE MODEL
  restore_checkpoint: pretrained/jax-model
  is_restore_optim: False
pfl_config:
  train: ids-train-all-960.csv
  batch_size: 360
  # set any cohort size - we use the same hyperparameters: 8, 16, 32, 64
  cohort_size: 16
  server_steps: 2000
local_optim_config:
  optim: sgd
  lr: 0.2
  num_epochs: 10
server_optim_config:
  optim: lamb
  lr: 0.003
  lr_schedule: exp
  lr_decay_start_update: 1000
  lr_exponential_decay_rate: 0.6
  lr_exponential_decay_transition_steps: 250